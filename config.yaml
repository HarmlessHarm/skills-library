# ---------------------------------------------------------------------------
# Skills Library configuration
#
# This is the only file you need to edit to make the site your own.
# Everything here feeds the site, the install snippets and the plugin manifest.
#
# Every value below is optional. Left empty, the repository details are worked
# out from GITHUB_REPOSITORY in CI, or from your `origin` remote locally — so a
# fresh fork already shows the right owner and links.
# ---------------------------------------------------------------------------

site:
  title: Skills Library
  tagline: A personal library of agent skills.
  description: Browse, search and install reusable skills for your coding agent.

  # Displayed as the maintainer. Defaults to the repository owner.
  author:

  # owner/repo — only set this to override what is detected automatically.
  repo:
  branch: main

  # Both optional. Leave empty and they are derived from the repository, so a
  # fork deploys to the correct path with no edits.
  #   url:  https://your-user.github.io
  #   base: /skills-library
  url:
  base:

# Fallbacks for anything a skill leaves out of its frontmatter.
defaults:
  version: "1.0.0"
  license: MIT

# Quick theming. For full control edit src/styles/theme.css instead.
theme:
  accent: "#4f46e5"
  accentDark: "#818cf8"
  font: "system-ui, -apple-system, 'Segoe UI', sans-serif"
  monoFont: "ui-monospace, SFMono-Regular, Menlo, monospace"
  radius: "12px"

# ---------------------------------------------------------------------------
# Install targets. The dropdown in the header switches between these, and each
# entry decides what the install snippets say.
#
# Every skill installs with the `skills` CLI (https://skills.sh):
#   npx skills add <owner>/<repo> --skill <name> -a <skillsAgent>
# `skillsAgent` is that CLI's identifier for the agent (see `npx skills --help`).
#
# `plugin` is an optional extra: a command that installs the whole library as
# a plugin. Leave it out and the hero only shows the `npx skills` install.
#
# Placeholders in `plugin`: {owner} {repo} {slug} {branch} {plugin}
# ---------------------------------------------------------------------------
defaultAgent: copilot

agents:
  - id: copilot
    label: GitHub Copilot
    skillsAgent: github-copilot
    docs: https://docs.github.com/en/copilot/concepts/agents/about-agent-skills

  - id: codex
    label: Codex
    skillsAgent: codex
    plugin: codex plugin marketplace add {slug}
    docs: https://developers.openai.com/codex/skills

  - id: claude
    label: Claude Code
    skillsAgent: claude-code
    plugin: |-
      /plugin marketplace add {slug}
      /plugin install {plugin}@{plugin}
    docs: https://code.claude.com/docs/en/skills
